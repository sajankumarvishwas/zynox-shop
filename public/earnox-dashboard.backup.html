<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#05070d">
  <title>EARN0X • Dashboard</title>
  <style>
    *{box-sizing:border-box}
    body{
      margin:0;
      min-height:100svh;
      display:grid;
      place-items:center;
      padding:20px;
      color:#fff;
      font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      background:
        linear-gradient(rgba(4,7,10,.28),rgba(4,7,10,.42)),
        url("/assets/earnox/liquid-bg.jpg") center/cover no-repeat fixed;
    }
    .box{
      width:min(100%,430px);
      padding:34px 24px;
      text-align:center;
      border:1px solid rgba(255,255,255,.22);
      border-radius:32px;
      background:rgba(255,255,255,.075);
      backdrop-filter:blur(32px) saturate(170%);
      -webkit-backdrop-filter:blur(32px) saturate(170%);
      box-shadow:0 30px 90px rgba(0,0,0,.36),inset 0 1px 0 rgba(255,255,255,.34);
    }
    h1{margin:0 0 10px;font-size:32px;letter-spacing:-.04em}
    p{margin:0;color:rgba(255,255,255,.68);line-height:1.6}
  </style>
</head>
<body>
  <main class="box">
    <h1>Welcome to EARN0X</h1>
    <p>Your account is successfully authenticated.<br>Dashboard features will be added next.</p>
  </main>
</body>
</html>
